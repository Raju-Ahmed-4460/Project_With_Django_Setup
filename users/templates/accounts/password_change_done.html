 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed Successfully</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-card {
            background: white;
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            font-size: 42px;
            line-height: 75px;
        }

        h1 {
            color: #1f2937;
            font-size: 26px;
            margin-bottom: 12px;
        }

        p {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .dashboard-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 13px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .dashboard-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">✓</div>

        <h1>Password Changed!</h1>

        <p>
            Your password has been changed successfully.
            You can now continue using your account securely.
        </p>

        <a href="{% url 'dashboard' %}" class="dashboard-btn">
            Go to Dashboard →
        </a>
    </div>
</body>
</html>
